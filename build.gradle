plugins {
  // Apply the Java Gradle plugin development plugin to add support for developing Gradle plugins
  id 'java-gradle-plugin'

  // Apply the Groovy plugin to add support for Groovy
  id 'groovy'

  // Add maven publishing plugin for testing with local maven repository
  id 'maven-publish'

  // publishing plugin
  id 'com.gradle.plugin-publish' version '2.1.0'

  id 'org.scm-manager.license' version '0.9.0'
}

repositories {
  mavenLocal()
  // Use maven central for resolving dependencies.
  // You can declare any Maven/Ivy/file repository here.
  mavenCentral()

  maven {
    url = 'https://plugins.gradle.org/m2/'
  }
}

def jettyVersion = '11.0.16'

dependencies {
  implementation(gradleApi())
  implementation 'com.github.node-gradle:gradle-node-plugin:7.1.0'
  implementation "org.eclipse.jetty:jetty-server:${jettyVersion}"
  implementation "org.eclipse.jetty:jetty-webapp:${jettyVersion}"
  implementation 'com.sun.xml.bind:jaxb-osgi:2.2.4-1'
  implementation 'com.google.guava:guava:32.0.1-jre'
  implementation 'org.apache.groovy:groovy-yaml:4.0.32'
  implementation 'org.apache.groovy:groovy-xml:4.0.32'
  implementation 'io.swagger.core.v3:swagger-gradle-plugin:2.2.52'
  implementation 'org.scm-manager:gradle-license-plugin:0.9.0'
  implementation 'org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:7.3.1.8318'
  implementation 'org.scm-manager.changelog:gradle-plugin:0.2.0'
  implementation 'org.apache.maven:maven-artifact:3.9.12'

  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.7.0'
  testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testImplementation 'org.assertj:assertj-core:3.11.1'
  testImplementation 'org.apache.groovy:groovy-test:4.0.32'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

project.tasks.withType(JavaCompile).configureEach {
  options.release = 17
}

test {
  useJUnitPlatform()
}

gradlePlugin {
  website = 'https://scm-manager.org'
  vcsUrl = 'https://github.com/scm-manager/gradle-smp-plugin'

  // Define the plugin
  plugins {
    smpPlugin {
      id = 'org.scm-manager.smp'
      implementationClass = 'com.cloudogu.smp.GradleSmpPlugin'
      displayName = 'Gradle SCM-Manager Plugin'
      description = 'Plugin to build and test SCM-Manager plugins'
      tags = ['scm-manager', 'smp', 'plugin']
    }
  }
}

// Add a source set for the functional test suite
sourceSets {
  functionalTest {
  }
}

gradlePlugin.testSourceSets(sourceSets.functionalTest)
configurations.functionalTestImplementation.extendsFrom(configurations.testImplementation)
configurations.functionalTestRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)

// Add a task to run the functional tests
tasks.register('functionalTest', Test) {
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
  useJUnitPlatform()
}

check {
  // Run the functional tests as part of `check`
  dependsOn(tasks.functionalTest)
  dependsOn checkLicenses
}

// publish plugin
// release tasks

task setVersion {
  doLast {
    if (!project.hasProperty('newVersion')) {
      throw new GradleException('usage setVersion -PnewVersion=x.y.z')
    }

    String version = project.property('newVersion')
    setVersion(version)
  }
}

task setVersionToNextSnapshot {
  doLast {
    def matcher = project.version.toString() =~ /^(\d+)\.(\d+)\.(\d+)(?:-.+)?$/
    if (!matcher.matches()) {
      throw new GradleException("version '${project.version}' does not follow major.minor.patch")
    }
    String version = "${matcher.group(1)}.${matcher.group(2)}.${matcher.group(3).toInteger() + 1}-SNAPSHOT"
    setVersion(version)
  }
}

task printVersion {
  doLast {
    println project.version
  }
}

license {
  header = project.rootProject.file('LICENSE-HEADER.txt')
}

def setVersion(String version) {
  Properties properties = new Properties()

  File propertiesFile = new File(project.rootDir, 'gradle.properties')
  propertiesFile.withInputStream { stream ->
    properties.load(stream)
  }

  if (properties.version == version) {
    println "project uses already version ${version}"
    return
  }

  println "set version from ${properties.version} to ${version}"

  properties.version = version
  propertiesFile.withOutputStream { stream ->
    properties.store(stream, 'gradle properties')
  }
}
